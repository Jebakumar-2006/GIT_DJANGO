{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{blog_title | default:"Document Title"}}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <h1 class="logo">Blog</h1>
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <h2 class="section-title">Latest Posts</h2>

        <div class="posts-grid">
            {% for post in posts %}
            <!-- Post 1 -->
            <article class="post-card">
                <div class="post-image-box">
                    <span>300 x 300</span>
                </div>
                <div class="post-content-box">
                    <div class="post-header-info">
                        <h3><a href="{% url 'blog:post_details' post_id=post.id %}">{{post.title}}</a></h3>
                        <span class="category-badge">Sports</span>
                    </div>
                    <p class="post-excerpt">{{post.content}}</p>
                    <a href="{% url 'blog:post_details' post_id=post.id %}" class="read-more">Read More</a>
                </div>
            </article>
{% endfor %}
        </div>
    </main>

</body>
</html>
